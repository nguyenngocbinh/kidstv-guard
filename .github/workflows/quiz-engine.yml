name: quiz-engine
on:
  push:
    paths:
      - 'packages/quiz-engine/**'
      - '.github/workflows/quiz-engine.yml'
  pull_request:
    paths:
      - 'packages/quiz-engine/**'
      - '.github/workflows/quiz-engine.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/quiz-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
